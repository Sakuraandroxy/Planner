# 仿真器配置。一段对应一套仿真器软件：怎么连、怎么起停。
# 加一个仿真器就在这里加一段，再在 maps.yaml 里用同一个 id 引用它。
#
# driver  目前只有 xpra_start，它把 argv 模板渲染成 xpra start --start-child 命令。
# probes  就绪判据：window 找引擎窗口并校验归属，ports 确认端口在监听，rpc 向 AirSim 发一次调用。
# 占位符由 planner/simulator/argv.py 提供：{display} {display_number} {runtime_dir}
#   {settings_file} {res_x} {res_y} {abslog} {map.id} {map.binary} {map.map_name}
#   {map.launch_map} {map.scene_file} {map.sim_config_path} {ports.<键>}，
#   驱动另提供 {start_child}。

default_simulator: projectairsim

projectairsim:
  label: ProjectAirSim (UE5)
  driver: xpra_start
  runtime: planner.simulators.projectairsim
  res_x: 1280
  res_y: 720
  abslog_dir: output/logs
  ports: {xpra: 10010, topics: 8991, services: 8992}
  # 场景约定：载具名、相机 id、起图机位。maps.yaml 的条目可逐项覆盖。
  scene_defaults:
    delay_after_load_s: 2.0
    rover_name: Rover1
    drone_name: Drone1
    cameras: {front: FrontCamera, chase: Chase, down: DownCamera}
    view_cycle_start: drone_front
  # 这套仿真器出的图像怎么解释。分辨率与挂点必须与场景里的 robot JSONC 一致。
  camera:
    width: 1280
    height: 720
    hfov_deg: 90.0
    far_m: 1000.0
    depth_is_range: true
    # 车前视相机：机体坐标（前、右、下，米）与安装姿态（度）。
    offset_m: [1.8, 0.0, -0.8]
    mount_rpy_deg: [0.0, -3.0, 0.0]
    # 无人机前视相机：与 robot_drone_flight.jsonc 的 FrontCamera 一致。
    drone_offset_m: [1.0, 0.0, 0.0]
    drone_mount_rpy_deg: [0.0, 0.0, 0.0]
  # 可切换的车型清单。只有声明了 vehicle_models 的仿真器能在控制台切车型。
  # 每张图用哪份场景写在 maps.yaml 的 scene.vehicle_scenes 里。
  vehicle_models:
    rover:
      default: offroad
      options:
        - id: offroad
          label: 越野车
    drone:
      default: quadrotor
      options:
        - id: quadrotor
          label: 四旋翼
        # 六旋翼没有默认场景，靠每张图在 maps.yaml 里给。
        - id: hexarotor
          label: 六旋翼
  # xpra 会话参数两套仿真器共用一份，airsim 段用 YAML 锚点引用。同一时刻只跑一个仿真器。
  argv: &xpra_argv
    - /usr/bin/xpra
    - start
    - "{display}"
    - --backend=x11
    - --daemon=no
    - --use-display=no
    - --start-via-proxy=no
    - "--start-child={start_child}"
    - --exit-with-children=yes
    - --terminate-children=yes
    - --sharing=yes
    - "--bind-tcp=0.0.0.0:{ports.xpra}"
    - --html=on
    - --dbus=no
    - --dbus-launch=
    - --pulseaudio=no
    - --notifications=no
    - --mdns=no
    - --printing=no
    - --file-transfer=no
    - "--log-dir={runtime_dir}/logs"
    - "--pidfile={runtime_dir}/xpra.pid"
    - "--xvfb=Xvfb -screen 0 {res_x}x{res_y}x24 +extension GLX +extension RANDR +extension RENDER +extension Composite -extension DOUBLE-BUFFER -nolisten tcp -noreset"
    - "--socket-dir={runtime_dir}/sockets"
    - "--socket-dirs={runtime_dir}/sockets"
    - "--sessions-dir={runtime_dir}/sessions"
  stop_argv: &xpra_stop_argv
    - /usr/bin/xpra
    - stop
    - "socket://{runtime_dir}/sessions/{display_number}/socket"
    - "--socket-dirs={runtime_dir}/sockets"
    - "--sessions-dir={runtime_dir}/sessions"
  # 引擎参数与打包产物自带的启动脚本一致。这个构建不写日志文件，-abslog 与 -Stdout
  # 没有对应文件输出；就绪判断用 window 与 ports 两个探针。
  child_argv:
    - "{map.binary}"
    - "{map.map_name}"
    - "-windowed"
    - "-ResX={res_x}"
    - "-ResY={res_y}"
    - "-nosound"
    - "-log"
    - "-topicsport={ports.topics}"
    - "-servicesport={ports.services}"
  probes: [window, ports]

airsim:
  label: AirSim (UE4)
  driver: xpra_start
  runtime: planner.simulators.airsim
  # planner 的引擎设置。尺寸与 FOV 见 docs/DEPLOYMENT.md 第 9 节。
  settings_file: config/airsim_settings.json
  # 连接数据与地图无关。vehicle_name 要与 settings.json 注册的载具同名，
  # 写成别的控制类 RPC 会失败：moveToPositionAsync 返回 False，landAsync 抛异常。
  host: ""                       # 空串 = AirSim 客户端的默认地址
  vehicle_name: Drone_1
  camera_id: front_center        # settings.json 里的相机名
  timeout_s: 15.0                # 单次 RPC 超时。动作超时见 core 档的 drone 段
  # 任务会话跑在子进程里。这个客户端依赖 msgpack-python 0.5.6，projectairsim 要
  # msgpack 1.2.4，两者同名冲突，装不进同一个环境。
  runtime_python: /home/kedior/miniconda3/envs/vln-ue4/bin/python
  res_x: 1280
  res_y: 720
  abslog_dir: output/logs
  ports: {xpra: 10010, rpc: 41451}
  argv: *xpra_argv
  stop_argv: *xpra_stop_argv
  # window 探针在窗口 map 之后才 focus：seamless xpra 在客户端接入前不 map 窗口，
  # UE4 对未 map 的窗口暂停渲染，取图会一直等。-RenderOffscreen 会连桌面画面一起去掉。
  probes: [window, ports, rpc]
  # {start_child} 由驱动用下面的 child_argv 拼成带引号的单个参数。
  child_argv:
    - "{map.binary}"
    - "{map.map_name}"
    - "-settings={settings_file}"
    - "-abslog={abslog}"
    - "-windowed"
    - "-ResX={res_x}"
    - "-ResY={res_y}"
