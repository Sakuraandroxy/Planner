# 视觉目标导航专用完成判定规则，与轨迹规划提示词及模型连接配置分开维护。
# 停稳后完成判定的距离上限，单位米；进入范围不等于完成，仍需语义完成判断。
radius_m: 7.0
# 当前位姿到本阶段记忆目标估计点的三维距离不超过此半径时暂停，单位米；与完成上限独立。省略时沿用radius_m。
pause_radius_m: 6.5
# 上次暂停检查后，在半径内再次触发所需的最小平移距离，单位米；与偏航变化条件满足任一即可。
rearm_translation_m: 0.5
# 上次暂停检查后，在半径内再次触发所需的最小偏航变化，单位度；离开半径也会重新布防。
rearm_yaw_deg: 10.0
# 单个视觉任务阶段允许调用语义完成判断模型的最多次数，超过后结束阶段。
maximum_completion_checks: 10
# 发送给完成判断模型的全部必需条件；任一未满足或无法确认均应返回false，只有确认完成后才清空未执行队列。
required_conditions:
  - 目标身份与原始任务一致，通过当前图像与参考图确认同一目标。
  - 到本阶段记忆目标估计点的距离满足半径上限、已配置高度边界及稳定观测条件；当前图像仍需确认原目标及任务要求。
  - 原始任务明确要求的其他观察条件已经满足；不得自行添加要求。
