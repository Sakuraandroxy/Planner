# 是否注册“飞到目标上方”任务；默认可用，未使用时不启动额外资源。
enabled: true
# 未指定米数时，完成任务所需的最小顶部净高，单位米；允许更高。
default_height_above_m: 5.0
# 明确指定顶部相对高度时的允许误差，单位米；未指定时用于最小净高的测量容差。
height_tolerance_m: 0.5
# 本地采图间隔，单位秒；独立于滑窗剩余点数，不代表每次采图都调用模型。
observation_interval_s: 1.0
# 需要改善视角时，两次暂停换角度观察之间的最短间隔，单位秒；不会定时强制停车。
view_checkpoint_interval_s: 10.0
# 完成判断为false后，再次尝试判断的最短间隔，单位秒。
completion_interval_s: 5.0
# 飞行中目标及顶部检测的请求间隔，单位秒；不会启动重叠检测。
detection_interval_s: 5.0
# 整个阶段的时间预算，单位秒；清空队列重规划不会重置。
maximum_duration_s: 600.0
# 整个阶段的规划调用上限；清空队列重规划不会重置。
maximum_planning_calls: 100
# 单次模型请求超时，单位秒；同时受阶段剩余时间约束。
model_request_timeout_s: 120.0
# 本任务的诊断日志、图像输出位置。
output_root: output/visual_goal_above
