# 控制台可切换的仿真地图目录。
#
# ProjectAirSim 一个 UE 进程只加载一张 cooked 地图，不能在运行中换图；
# 切换地图 = 后台停掉整套仿真栈（xpra + UE + Xvfb），再用 launch_map
# 对应的启动脚本拉起目标地图，然后重连。
#
# id:          控制台/API 使用的地图标识。
# label:       控制台显示名称。
# simulator:  驱动这张图的仿真器，对应 config/simulators.yaml 的一段。
#
# projectairsim（scene 驱动）额外字段：
# launch_map:      scripts/launch_projectairsim_xpra.sh 的第一个参数。
# scene_file:      该地图的双载具场景 JSONC（位于 sim_config_path 下）。
# sim_config_path: World 加载场景时的配置目录（相对仓库根目录）。
#
# airsim（binary 驱动）额外字段：路径来自 airsim-flight-console/scene_launcher.py:19-27。
# binary:          UE4  cooked 二进制绝对路径。
# map_name:        传给二进制的地图名（AirSim 读作 argv[1]）。
default_map: cityenviron
maps:
  - id: cityenviron
    simulator: projectairsim
    label: 城市 CityEnviron
    launch_map: cityenviron
    scene_file: scene_city_dual.jsonc
    sim_config_path: config/scenes/city
  - id: neighborhood
    simulator: projectairsim
    label: 郊区 Neighborhood
    launch_map: neighborhood
    scene_file: scene_neighborhood_dual.jsonc
    sim_config_path: config/scenes/neighborhood

  # ---- AirSim UE4 ----
  - id: airsimnh
    simulator: airsim
    label: AirSim 郊区 NH
    binary: /data/airsim/AirSimNH/LinuxNoEditor/AirSimNH/Binaries/Linux/AirSimNH
    map_name: AirSimNH
  - id: abandonedpark
    simulator: airsim
    label: AirSim 废弃公园
    binary: /data/airsim/AbandonedPark/LinuxNoEditor/AbandonedPark/Binaries/Linux/AbandonedPark
    map_name: AbandonedPark
  - id: msbuild2018
    simulator: airsim
    label: AirSim MSBuild 园区
    binary: /data/airsim/MSBuild2018/LinuxNoEditor/MSBuild2018/Binaries/Linux/MSBuild2018
    map_name: MSBuild2018
  - id: trapcam
    simulator: airsim
    label: AirSim TrapCam
    binary: /data/airsim/TrapCam/LinuxNoEditor/TrapCam/Binaries/Linux/TrapCam
    map_name: TrapCam
  - id: blocks
    simulator: airsim
    label: AirSim Blocks
    binary: /data/airsim/Blocks/LinuxNoEditor/Blocks/Binaries/Linux/Blocks
    map_name: Blocks
  - id: shanghai
    simulator: airsim
    label: AirSim 上海
    binary: /data/airsim/Shanghai/LinuxNoEditor/Shanghai/Binaries/Linux/Shanghai
    map_name: Shanghai
  # 本机从 ue4/urbanScene 自己打包的那张，已验二进制存在且可执行。
  - id: campus
    simulator: airsim
    label: AirSim 校园
    binary: /data/airsim/Campus/LinuxNoEditor/Campus/Binaries/Linux/Campus
    map_name: Campus
