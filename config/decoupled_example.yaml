# Uni-LaViRA 功能优先配置示例
# 核心原则:
# 1. FUNCTIONS 下面写“功能用哪个实现、调用哪个模型、模型怎么连接”。
# 2. 不再使用 MODELS 注册表做二次跳转。
# 3. Python 路径仍由 agent/core/registry.py 内部维护，YAML 只写短名。

FUNCTIONS:
  TASK_PARSER:
    NAME: vlm_task_parser                 # 任务解析功能实现，固定从 agent/functions/task_parser 中选择
    MODEL: openai_chat                    # 任务解析调用的模型接口类型，OpenAI 兼容 chat API
    URL: http://172.27.143.102:8000/v1    # 任务解析 API base_url，本地服务或云端 OpenAI 兼容地址
    MODEL_NAME: /data/sakura/models/Qwen2.5-7B-Instruct-AWQ  # 任务解析模型名或本地模型路径
    API_KEY: no-key                       # API key，本地服务通常 no-key，云端填写 sk-...
    MAX_TOKENS: 1024                      # 任务解析最大输出 token 数
    TEMPERATURE: 0.0                      # 任务解析温度，0 表示稳定输出 JSON

  PERCEPTION:
    NAME: dual_view_detector              # 目标检测功能实现，负责 front/down 双视图检测和选择结果
    MODEL: groundingdino                  # 目标检测模型后端: groundingdino | vlm_detector | noop
    URL: http://172.27.143.102:8003/detect # GroundingDINO 检测服务地址；vlm_detector 时填 OpenAI 兼容 base_url
    MODEL_NAME: ""                        # VLM detector 的模型名；GroundingDINO 不需要可留空
    API_KEY: no-key                       # VLM detector API key；GroundingDINO 不需要
    BOX_THRESHOLD: 0.4                    # GroundingDINO box threshold
    TEXT_THRESHOLD: 0.3                   # GroundingDINO text threshold
    MIN_CONFIDENCE: 0.4                   # 功能层接受目标框的最低置信度
    TIMEOUT: 120                          # 目标检测请求超时秒数
    PARALLEL: true                        # 是否并行检测 front/down 两个视图

  COMPLETION:
    NAME: depth_detector                  # 任务完成判定功能: depth_detector | api_completion
    MODEL: mimo-v2.5                      # 完成判定 VLM 模型名
    URL: https://api.xiaomimimo.com/v1    # 完成判定 VLM 的 OpenAI 兼容 base_url
    API_KEY: sk-cyx6rpmwj842kezx5voi4p4toef2hud1wp4miul5r2p8xnl8                    # 完成判定 API key，本地服务通常 no-key
    MAX_TOKENS: 64                        # 完成判定只需要短 JSON，避免输出原因
    TIMEOUT: 60                           # 完成判定请求超时秒数
    TEMPERATURE: 0.0                      # 完成判定温度，0 表示保守稳定
    RGB_CAPTURE_PROFILE: front_down       # 快系统常规抓图，只取前视图+下视图 RGB
    DEPTH_CAPTURE_PROFILE: front_down_both_depth # 慢系统需要判定完成时才额外抓深度
    STOP_DEPTH_THRESHOLD: 8.0             # 到达半径/停止深度阈值，单位米
    VLM_FINAL_JUDGE_ENABLED: true         # 是否让 VLM 结合双视图、bbox、深度、任务目标做最终裁决
    VLM_FAIL_FALLBACK_TO_HEURISTIC: false # VLM 失败时是否回退到纯深度启发式

  PLANNING:
    NAME: sliding_window_planning         # 规划功能实现，负责调用滑窗 Qwen 并返回增量 waypoint
    MODEL: qwen_sliding_window_planner    # 规划模型后端，滑窗版 Qwen
    URL: ""                               # 若填写完整 chat URL 则优先使用，覆盖 SERVER_IP/PORT/CHAT_PATH
    SERVER_IP: 172.27.143.102             # 滑窗 Qwen 服务器 IP，明天换服务器优先改这里
    SERVER_PORT: 8004                     # 滑窗 Qwen OpenAI 兼容服务端口
    CHAT_PATH: /v1/chat/completions       # 滑窗 Qwen OpenAI 兼容 chat 路径
    MODEL_NAME: /data/sakura/models/3DG-VLN-finetuned-sliding_window # 滑窗 Qwen 模型名或路径
    API_KEY: no-key                       # 滑窗 Qwen API key，本地服务通常 no-key
    MAX_TOKENS: 256                       # 滑窗 Qwen 最大输出 token 数，只输出 waypoint JSON
    TIMEOUT: 120                          # 滑窗 Qwen 请求超时秒数
    MAX_PENDING: 3                        # 输入给 Qwen 的 pending 增量 waypoint 最大数量，匹配滑窗训练上限
    MAX_ADDITIONAL: 5                     # Qwen 单次最多补充的增量 waypoint 数量
    RESIZE_ENABLED: true                  # 发送给 Qwen 前是否缩放图像
    IMAGE_SIZE: 1024                      # Qwen 输入图像尺寸
    RESIZE_MODE: square                   # square=强制正方形；long_edge=等比例缩放长边

  TRAJECTORY_QUEUE:
    NAME: world_queue                     # 轨迹队列功能实现，内部保存 absolute world waypoint
    MAX_PENDING: 3                        # 给 Qwen 的最多 pending 增量点数量，匹配滑窗训练上限
    EXECUTE_COUNT: 3                      # 快系统每次取3个队列点
    EXECUTION_SETTLE_S: 0.15              # 每次飞完后等待秒数，让PID收敛减少摇晃；调大=更稳但更顿
    CLEAR_ON_STAGE_CHANGE: true           # stage 切换时是否清空队列
    CLEAR_ON_COLLISION: true              # 碰撞后是否清空队列

  FAST_SLOW:
    NAME: fast_slow_controller            # 快慢系统调度功能实现
    ENABLED: true                         # 是否启用快慢双系统
    LOW_WATERMARK: 3                      # 队列剩余<=3且Qwen空闲时后台补轨迹
    HIGH_WATERMARK: 10                     # 队列目标上限，避免队列无限增长
    EXECUTE_COUNT: 3                      # 快系统每次取3个队列中的 world waypoint
    MERGE_EXECUTION_WAYPOINTS: true       # 将多个累计waypoint合并成最后一个目标点一次执行，减少顿挫
    COMPLETION_INTERVAL_S: 1.5            # 慢系统两次 completion 检查之间的最小间隔
    STOP_RADIUS: 2.0                      # 演示模式: 进入6m后暂停确认，比4m更不容易飞过
    SLOW_RADIUS: 2.0                      # 当前不直接触发暂停，和STOP_RADIUS保持一致便于看日志

  RELOCALIZATION:
    NAME: turn_search                     # 重定位功能实现，目标不可见时原地环视搜索
    ENABLED: True                        # 是否启用重定位；汇报前可关闭避免额外动作
    CAPTURE_PROFILE: front_down           # 重定位每个方向的抓图 profile
    TURN_DEG: 90.0                        # 每次原地转向角度
    MAX_TURNS: 4                          # 最多检查方向数

  COLLISION_RECOVERY:
    NAME: backoff                         # 碰撞恢复功能实现
    ENABLED: true                         # 是否启用碰撞后退恢复
    BACK_DISTANCE_M: 2.0                  # 碰撞后沿当前机体后方后退距离
    VELOCITY: 1.0                         # 后退速度，单位 m/s

SIM:
  FRONT_WIDTH: 1024                       # 前视 RGB 宽度
  FRONT_HEIGHT: 1024                      # 前视 RGB 高度
  FRONT_FOV: 90                           # 前视相机水平视场角
  DEPTH_WIDTH: 256                        # 前视深度图宽度
  DEPTH_HEIGHT: 256                       # 前视深度图高度
  DEPTH_FOV: 90                           # 前视深度相机视场角
  DOWN_WIDTH: 1024                        # 下视 RGB 宽度
  DOWN_HEIGHT: 1024                       # 下视 RGB 高度
  DOWN_FOV: 90                            # 下视相机水平视场角
  DOWN_DEPTH_WIDTH: 256                   # 下视深度图宽度
  DOWN_DEPTH_HEIGHT: 256                  # 下视深度图高度
  DOWN_DEPTH_FOV: 90                      # 下视深度相机视场角
  CAPTURE_MODE: parallel                  # 抓图模式: batch | parallel
  CAPTURE_PROFILE: auto                   # auto 表示快系统按需要动态抓 RGB 或深度
  AIRSIM_IP: ""                           # AirSim RPC IP，空字符串表示 localhost
  AIRSIM_PORT: 41451                      # AirSim RPC 端口，默认 41451
  APPLY_SETTINGS_ON_WEB_START: true       # 启动 Web 入口时是否写入 AirSim settings.json
  WAIT_FOR_AIRSIM_ON_WEB_START: true      # AirSim 未启动时是否等待连接
  WAIT_FOR_AIRSIM_INTERVAL: 2.0           # AirSim 连接重试间隔秒数
  AIRSIM_CONNECT_TIMEOUT: 3.0             # 单次 AirSim RPC 握手超时秒数
  AIRSIM_MOVE_TIMEOUT: 60                 # AirSim 运动 RPC 超时秒数
  AIRSIM_VELOCITY: 2.0                    # 无人机执行轨迹速度，单位 m/s
  PAUSE_BACKGROUND_CAPTURE_DURING_STEP: true # step 期间是否暂停前端后台抓图

WEB:
  PORT: 5000                              # Web Dashboard 端口

EVAL:
  SUCCESS_RADIUS: 10.0                    # 成功半径，单位米
  MAX_STEPS: 100                          # 单个任务最大闭环步数
  INIT_MOVE_VELOCITY: 5.0                 # 初始化移动速度
  INIT_MOVE_TIMEOUT: 30.0                 # 初始化移动超时秒数
  INIT_SETTLE_SECONDS: 1.0                # 初始位姿稳定等待秒数
  SCENE_SWITCH_RECONNECT_WAIT: 2.0        # 切场景后重连等待秒数
  SCENE_STARTUP_WAIT: 60                  # 场景启动最长等待秒数
  REMOTE_HOST: sakura-airsim              # 远端 AirSim 主机名
  REMOTE_USER: ""                         # 远端 SSH 用户名，空表示不强制
  REMOTE_PORT: 22                         # 远端 SSH 端口
  AUTO_SSH_TUNNEL: true                   # 远端评测时是否自动建立端口转发

