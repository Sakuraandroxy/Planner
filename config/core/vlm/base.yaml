profile:
  id: vlm
  label: 普通 VLM
  note: DeepSeek 直连，通用导航参数
drone:
  # 平移速度上限，米/秒。飞行动作的位移按它规划。
  speed_mps: 2.0
  # 单段运动执行与停稳等待的超时上限，单位秒。
  move_timeout_s: 60.0
  # 原生起飞与降落各自的仿真时间上限，单位秒。
  takeoff_timeout_s: 30.0
  land_timeout_s: 30.0
  # 起飞前等待状态稳定（时间戳推进且静止）的持续时间与轮询间隔，单位秒。
  readiness_stable_s: 2.0
  readiness_poll_interval_s: 0.25
  # 原生起飞只把飞机抬离地面一点，这里补到作业高度，米。取零表示不补。
  takeoff_climb_m: 1.0

# 深度可视化协议与范围。目标定位只用下限，上限只影响可视化。
depth:
  # 可视化编码协议，须与规划模型的训练一致。
  mapping: log_inverse_gray_v1
  # 可视化下限，同时也是目标定位的深度下限，米。
  min_m: 0.5
  # 可视化上限，米。不限制目标定位距离。
  max_m: 200.0

motion:
  # 演示对照组：这一档的每个改动都是故意调差的，不是推荐参数。
  max_speed_mps: 3.0
  max_accel_mps2: 1.0
  max_yaw_rate_dps: 30.0
  max_yaw_accel_dps2: 60.0
  control_hz: 20.0
  min_duration_s: 1.0
  # 航向伺服，两种载具共用一套，只有位置保持读它。
  # 这一档按演示对照组把增益降到 0.25。实测 UE5 偏航执行链的等效增益约 0.3、
  # 纯延迟约 3 秒，延迟这么大时增益超过 1 会自激。
  heading_hold_gain: 0.25
  # 阻尼项从指令里扣掉实测角速度。延迟超过 90° 相位后它会变成助推，所以取零；
  # 执行链变快后可以打开到 0.3~0.6。
  heading_rate_damping: 0.0
  # 误差与角速度同时小于阈值时不发指令，免得测量抖动变成左右摆。
  heading_deadband_deg: 0.5
  heading_rate_deadband_dps: 1.5
  # 连续跟踪的参考点与平滑上限，滑窗续规划和连续执行用它。
  continuous:
    # 前瞻时间，秒，按当前速度换算成距离。
    lookahead_time_s: 0.3
    # 前瞻距离下限，米。
    min_lookahead_m: 0.3
    # 前瞻距离上限，米。
    max_lookahead_m: 1.5
    # 平移加速度的最大变化率，米/秒³。
    max_jerk_mps3: 3.0
    # 偏航角加速度的最大变化率，度/秒³。
    max_yaw_jerk_deg_s3: 60.0

# 目标定位用的视觉模型端点。url 或 model 留空时改用手动检测器，
# 由 config/app.yml 的 server.detector 决定。
target_detection:
  # 请求格式：openai 发 max_completion_tokens，deepseek 发 max_tokens 加思考开关，
  # anthropic 走 Messages API，此时 reasoning_effort 只能是 none。
  request_format: anthropic
  url: https://api.deepseek.com/anthropic
  model: deepseek-flash
  # 直接写在配置里的密钥优先于 api_key_env。填了真实密钥就别提交这个文件。
  api_key: ""
  api_key_env: VLN_API_KEY
  timeout_s: 30.0
  # openai 格式下设 none 关闭思考。
  reasoning_effort: none
  # 一个框加最多五个表面点的输出上限。
  max_completion_tokens: 2048
  max_image_side: 1024
  # 近于此值的表面点按无效处理，米。
  minimum_depth_m: 0.5

# 轨迹规划用的视觉模型端点：一次给出五个航点。
trajectory_planner:
  url: https://api.deepseek.com/anthropic
  model: deepseek-flash
  # 优先使用此处的 key；留空则读取 api_key_env。
  api_key: ""
  api_key_env: VLN_API_KEY
  timeout_s: 25.0
  max_tokens: 256
  # 与其它三段一致：openai / deepseek / anthropic。
  # anthropic 使用 Messages API，只接受 reasoning_effort: none。
  request_format: anthropic
  reasoning_effort: none
  # 地面车 VLM 实测输出约 4 m 步长；参考 UAV 默认上限为 30 m。
  max_step_m: 6.0

# 独立任务完成判断模型：本地到达条件满足后调用，只接受 true 或 false。
task_completion:
  url: https://api.deepseek.com/anthropic
  model: deepseek-flash
  # 优先使用此处的 key；留空则读取 api_key_env。
  api_key: ""
  api_key_env: VLN_API_KEY
  timeout_s: 8.0
  max_completion_tokens: 2048
  reasoning_effort: none
  request_format: anthropic

# 任务解析模型：自然语言指令 → mission_plan_v1（有先后顺序的阶段）。
# url 或 model 留空、端点不可用时，控制台仍能连接看画面，但任务会被明确拒绝，
# 没有确定性回退。
task_parser:
  url: https://api.deepseek.com/anthropic
  model: deepseek-flash
  # 优先使用此处的 key；留空则读取 api_key_env。
  api_key: ""
  api_key_env: VLN_API_KEY
  timeout_s: 60.0
  max_completion_tokens: 2048
  reasoning_effort: none
  request_format: anthropic

# 滑窗续规划：已有队列执行时请求后续点；队列耗尽而新点未就绪时允许等待。
sliding_window:
  # true 启用支持滑窗的工作流续规划。
  enabled: true
  # 已授权世界航点的队列容量；每次新增仍为 5 点。
  max_buffer_points: 6
  # 剩余航点数不超过此值时触发补点，范围 1 至 5。
  refill_pending_count: 1
  # 提前补点的时间余量，单位秒。
  latency_margin_s: 1.5
  # 连续执行以时间触发续规划，单位秒。
  planning_interval_s: 9.0
  # 单次滑窗阶段的总时长上限，单位秒。
  max_task_duration_s: 600.0
  # 连续规划失败达到此次数时终止滑窗续规划；留出余量吸收端点偶发超时。
  max_consecutive_plan_failures: 2
  # 滑窗规划观测的最大有效年龄，单位秒。
  max_observation_age_s: 120.0

# 无目标道路跟随（free_navigation）的接触恢复。
free_navigation:
  # ProjectAirSim 原生碰撞事件触发后沿当前航向倒车的距离，单位米。
  # 第 n 次连续恢复按 n 倍递增（默认 3/6/9 米），让重规划获得更宽的视野。
  collision_backoff_m: 3.0
  # 单次任务允许的碰撞恢复次数；超过后按执行错误结束。
  maximum_collision_recoveries: 3
  # 恢复后累计前进达到此距离时清零连续恢复计数，单位米。
  # 自由导航是无界任务：只有连续原地反复碰撞才应耗尽预算。
  collision_recovery_reset_m: 20.0

# 视觉目标导航工作流专用配置。
visual_goal_navigation:
  enabled: true
  # 确认 RGB/深度配准、内参与深度语义已核实；false 阻止视觉任务准备。
  geometry_verified: true
  # 本工作流是否读取仿真器碰撞事件并中断。
  collision_check_enabled: false
  # 视觉任务诊断日志和观测图像的输出根目录。
  output_root: output/visual_goal/vlm
  # 完成判定规则文件；相对路径以主配置所在目录为基准。
  completion_rules_file: tasks/visual_goal_navigation.yaml
  # 本地表面点深度筛选：不增加模型请求，只删除明显远背景层的原有点。
  depth_foreground_filter:
    enabled: true
    pixel_radius: 3
    depth_gap_ratio: 4.0
  # 目标框中心测距、接近、确认与搜索策略参数。
  limits:
    # 距离测量的工程余量，单位米；0 表示不额外收紧完成判定半径上限。
    distance_uncertainty_margin_m: 0.0
    # 相对阶段起点允许的最大高度变化，单位米；null 不限制。
    maximum_vertical_offset_m: null
    # 本地到达条件需要的连续合格观测次数，至少 2。
    confirmation_count: 3
    # 连续到达确认观测之间的最小时间间隔，单位秒。
    confirmation_interval_s: 1.0
    # 单个视觉任务阶段允许的最大规划轮数。
    maximum_planning_rounds: 18
    # 单个视觉任务阶段总时长上限，单位秒。
    maximum_task_duration_s: 600.0
    # true 允许目标不可见时按本地策略分步转向搜索。
    search_enabled: true
    # 飞行中目标检测的最小刷新间隔，单位秒。
    target_refresh_interval_s: 5.0
    # 后续候选位置相对首次锁定点允许的最大三维偏差，单位米。
    target_position_update_radius_m: 0.5

