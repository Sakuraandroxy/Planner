# Copy to visual_goal_navigation.local.yaml. Verify calibration/model before enabling.
# No server connection or takeoff is performed by loading this file.
task_parser:
  url: http://172.27.100.117:8000/v1
  model: /data/sakura/models/Qwen2.5-7B-Instruct-AWQ
  api_key: no-key
  timeout_s: 120
trajectory_planner:
  url: http://172.27.100.117:8004/v1
  model: /roxy/zhusai/qwen_lora/models/3dg_vln_segment_v3_checkpoint_700
  api_key: no-key
  timeout_s: 20
goal_observer:
  url: http://127.0.0.1:8005/v1
  model: REPLACE_WITH_VERIFIED_VISION_MODEL
  api_key: no-key
  api_key_env: GOAL_OBSERVER_API_KEY
  timeout_s: 20
airsim:
  host: ""
  port: 41451
  camera_id: front_center
  connect_timeout_s: 5
  move_timeout_s: 60
  speed_mps: 2.0
depth:
  min_m: 0.5
  max_m: 200.0
trajectory:
  point_count: 5
  max_step_m: 30.0
  max_yaw_step_deg: 180.0
motion:
  control_hz: 20.0
  max_acceleration_mps2: 1.5
  max_yaw_rate_deg_s: 30.0
  max_yaw_acceleration_deg_s2: 30.0
  position_tolerance_m: 0.3
  yaw_tolerance_deg: 2.0
recording:
  output_root: output/camera_api
  fps: 5.0
basic_motion:
  free_space:
    confirmed: false
    minimum_world_ned_m: null # Independent of visual_goal initial free bubble.
    maximum_world_ned_m: null
    clearance_radius_m: 1.0
visual_goal_navigation:
  enabled: false
  geometry_verified: false
  initial_clearance_confirmed: false
  depth_horizontal_fov_deg: 90.0 # Must match DepthPerspective CaptureSettings, not assumed Scene FOV.
  output_root: output/visual_goal
  limits:
    maximum_surface_candidates: 5 # Upper bound, not a requirement to invent five points.
    association_gate_m: 1.5 # Match the selected region, not arbitrary points on the same object.
    standoff_m: 4.0
    distance_tolerance_m: 1.0
    distance_uncertainty_margin_m: 0.3
    confirmation_count: 2
    confirmation_interval_s: 0.5
    maximum_round_distance_m: 6.0
    maximum_round_motion_s: 8.0
    maximum_planning_rounds: 30
    maximum_task_duration_s: 600.0
    search_enabled: true
    search_clearance_confirmed: false
    vehicle_radius_m: 0.5 # Experimental assumption; replace with measured envelope.
    nominal_obstacle_clearance_m: 1.0
    tracking_margin_m: 0.3
    initial_clearance_radius_m: 4.0 # Static initial bubble must be confirmed in experiment setup.
