task_parser:
  url: http://172.27.100.117:8000/v1
  model: /data/sakura/models/Qwen2.5-7B-Instruct-AWQ
  api_key: no-key
  api_key_env: TASK_PARSER_API_KEY
  timeout_s: 120

trajectory_planner:
  url: http://172.27.100.117:8004/v1
  model: /roxy/zhusai/qwen_lora/models/3dg_vln_segment_v3_checkpoint_700
  api_key: no-key
  api_key_env: TRAJECTORY_PLANNER_API_KEY
  timeout_s: 120 # 超时时间

airsim:
  host: ""
  port: 41451
  camera_id: front_center
  connect_timeout_s: 5
  move_timeout_s: 60
  speed_mps: 2.0 # 在平滑控制中表示三维最高合速度上限

depth:
  min_m: 0.5
  max_m: 200.0

trajectory:
  point_count: 5
  max_step_m: 30.0
  max_yaw_step_deg: 180.0

motion:
  control_hz: 20.0
  max_acceleration_mps2: 1.5
  max_yaw_rate_deg_s: 30.0
  max_yaw_acceleration_deg_s2: 30.0
  position_tolerance_m: 0.3
  yaw_tolerance_deg: 2.0

recording:
  output_root: output/camera_api
  fps: 5.0

