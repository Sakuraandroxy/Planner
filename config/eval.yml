# 场景包根（含 closeloop_envs/、carla_town_envs/）与数据集根（含 test/、unscene/、
# unobject/、meta/）。填绝对路径，或相对本文件所在目录的路径。
maps_path: /roxy/vln/TravelUAV_env
dataset_path: /data/sakura/data/UAV-VLN-FOV

# 相对仓库根，保持已有运行结果和保存记录的位置。
output_dir: eval/output
saved_dir: eval/saved
dashboard_port: 8010

# 评测报告尾部那段 AI 评语的模型。密钥优先读 api_key，留空则读环境变量（与规划器共用）。
ai_report:
  url: https://api.deepseek.com/anthropic
  model: deepseek-flash
  api_key: ""
  api_key_env: VLN_API_KEY
  timeout_s: 90.0
  max_completion_tokens: 2048
  reasoning_effort: none
  request_format: anthropic
  words: 500
