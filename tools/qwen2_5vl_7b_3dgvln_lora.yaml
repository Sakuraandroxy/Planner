# LLaMA-Factory 微调配置 —— Qwen2.5-VL-7B LoRA for 3DG-VLN waypoint prediction
# 用法: llamafactory-cli train configs/qwen2_5vl_7b_3dgvln_lora.yaml

### model
model_name_or_path: /data/sakura/models/3DG-VLN

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
deepspeed: /data/sakura/data/UAV-VLN-FOV/tools/ds_zero3_offload.json

### dataset
dataset: 3dgvln_waypoints
dataset_dir: /data/sakura/data/UAV-VLN-FOV/finetune_data
template: qwen2_vl
cutoff_len: 4096
max_samples: 50000
overwrite_cache: true
preprocessing_num_workers: 4
# 多图输入，需要调大 max_pixels 保留高分辨率细节
image_max_pixels: 1048576   # 1024x1024

### output
output_dir: ./output/qwen2_5vl_7b_3dgvln_lora
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval (可选: 如果有 validation set)
# val_size: 0.05
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 500
