<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- 手机不重排：按桌面宽度 1280 渲染，由浏览器整体缩放。 -->
  <meta name="viewport" content="width=1280" />
  <meta name="theme-color" content="#0e1214" />
  <title>ProjectAirSim VLN 控制台</title>
  <link rel="stylesheet" href="/console/theme.css" />
  <link rel="stylesheet" href="/console/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>导航任务在线控制台</h1>
    </div>
    <div class="topbar-actions">
      <a class="ghost" id="world-model" href="#"
        title="前往世界模型工作台">世界模型工作台</a>
      <a class="ghost" id="eval-dash" href="#" title="前往 UAV-VLN 评测系统">评测系统</a>
      <a class="ghost" id="video-demo" href="#" title="前往视频演示">视频演示</a>
      <div class="state-chip" id="state-chip" data-state="unknown">
        <span class="dot"></span><span id="state-text">状态未确认</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="card viewport-card" aria-label="交互画面">
      <div class="card-head">
        <h2>交互画面</h2>
        <div class="head-tools">
          <span class="muted" id="stream-status">连接交互画面…</span>
          <button type="button" class="ghost" id="view-toggle">相机画面</button>
        </div>
      </div>
      <div class="viewport" id="viewport">
        <iframe id="xpra-frame" tabindex="0" title="ProjectAirSim 交互画面"
          allow="fullscreen" referrerpolicy="no-referrer"></iframe>
        <img id="video" alt="ProjectAirSim 相机实时画面" hidden />
        <div class="overlay" id="video-overlay" hidden>
          画面未就绪
          <small>worker 连接 ProjectAirSim 后自动显示；任务运行时为实时画面</small>
        </div>
        <div class="overlay" id="xpra-overlay" hidden>
          未连接任何场景
          <small>先在「世界设置」选择地图并点击「启动场景」<br>就绪后点「重试画面」</small>
        </div>
        <div class="shield" id="view-shield" hidden>
          <p id="shield-hint"></p>
        </div>
      </div>
      <div class="card-foot">
        <span class="muted" id="view-hint">点击画面后用 WASD / 右键拖动</span>
        <div class="foot-actions">
          <div class="segmented" id="view-modes" role="group" aria-label="任务视角">
            <button type="button" data-perspective="first"
              title="当前载具的前视相机">第一人称</button>
            <button type="button" data-perspective="third"
              title="从后上方跟着当前载具">第三人称</button>
          </div>
          <button type="button" class="ghost" id="focus-view"
            title="返回画面接收键盘输入；鼠标视角请点击画面">恢复控制</button>
          <button type="button" class="ghost" id="retry-video">重试画面</button>
          <a class="ghost" id="open-xpra" target="_blank"
            rel="noopener noreferrer" hidden>独立打开 ↗</a>
        </div>
      </div>
    </section>

    <aside class="side">
      <section class="card command-card">
        <div class="card-head">
          <h2>控制台</h2>
          <span class="hint">Enter 发送 · Shift+Enter 换行</span>
        </div>
        <form id="task-form" class="stack">
          <label>载具</label>
          <div class="segmented" id="vehicle-modes" role="group" aria-label="选择载具">
            <button type="button" data-vehicle="drone"
              title="切换到无人机：停放无人车并回到起点">无人机</button>
            <button type="button" data-vehicle="rover"
              title="切换到无人车：停放无人机并回到起点">无人车</button>
          </div>
          <label for="instruction">指令</label>
          <div class="instruction-row">
            <textarea id="instruction" rows="3" maxlength="2000"
              placeholder="例如：向前直行 5 米，然后左转 90 度，再开到前方的红色汽车；或：飞到画面中的目标"></textarea>
            <label class="preset-strip" id="preset-strip" hidden>
              <select id="instruction-preset"></select>
              <span aria-hidden="true">☰</span>
            </label>
          </div>
          <div class="toolbar">
            <button type="submit" id="start" class="primary" disabled>开始执行</button>
            <button type="button" id="stop" class="danger" disabled>停止当前任务</button>
            <button type="button" id="home" class="ghost" disabled
              title="仅空闲时可用，当前选中载具会瞬时传送回出生点">回到起点</button>
            <button type="button" id="clear-instruction" class="ghost">清空指令</button>
            <button type="button" id="eval-save" class="ghost" disabled title="把最近一次任务中带目标的子任务保存为执行记录">保存执行记录</button>
          </div>
        </form>
        <p class="feedback" id="feedback" role="status"></p>
        <div class="facts-row">
          <dl class="facts">
            <div><dt>当前载具</dt><dd id="current-vehicle">—</dd></div>
            <div><dt>当前指令</dt><dd id="current-instruction">—</dd></div>
            <div><dt>最近结果</dt><dd id="last-result">—</dd></div>
            <div><dt>当前规划器</dt><dd id="current-profile">—</dd></div>
          </dl>
          <div class="scene" id="scene-card">
            <canvas id="scene-canvas"></canvas>
            <p class="hint">待执行路径</p>
          </div>
        </div>
      </section>

      <section class="card settings-card" id="settings-card">
        <div class="tabs" role="tablist" aria-label="设置">
          <button type="button" class="tab active" id="tab-world" data-tab="world"
            role="tab" aria-selected="true" aria-controls="panel-world">世界设置</button>
          <button type="button" class="tab" id="tab-weather" data-tab="weather"
            role="tab" aria-selected="false" aria-controls="panel-weather">天气设置</button>
          <button type="button" class="tab" id="tab-models" data-tab="models"
            role="tab" aria-selected="false" aria-controls="panel-models">模型设置</button>
          <button type="button" class="tab" id="tab-profile" data-tab="profile"
            role="tab" aria-selected="false" aria-controls="panel-profile">规划器设置</button>
        </div>
        <div class="tab-panels">
          <div class="tab-panel" id="panel-world" role="tabpanel" aria-labelledby="tab-world">
            <div class="stack">
              <label for="world-map">地图</label>
              <select id="world-map" disabled></select>
              <div class="toolbar">
                <button type="button" id="world-apply" class="primary" disabled>应用世界设置</button>
                <button type="button" id="world-stop" class="danger" disabled>停止世界</button>
                <button type="button" id="world-reload" class="ghost" disabled>刷新选项</button>
              </div>
            </div>
            <p class="feedback" id="world-feedback" role="status"></p>
          </div>

          <div class="tab-panel" id="panel-weather" role="tabpanel"
            aria-labelledby="tab-weather" hidden>
            <div class="stack">
              <label for="weather-preset">预设</label>
              <select id="weather-preset" disabled></select>
              <details class="weather-details" id="weather-details">
                <summary>全部天气参数</summary>
                <div class="weather-grid" id="weather-fields"></div>
              </details>
              <div class="toolbar">
                <button type="button" id="weather-apply" class="primary" disabled>应用天气</button>
              </div>
            </div>
            <p class="feedback" id="weather-feedback" role="status"></p>
          </div>

          <div class="tab-panel" id="panel-models" role="tabpanel"
            aria-labelledby="tab-models" hidden>
            <div class="stack">
              <label for="model-rover">无人车模型</label>
              <select id="model-rover" disabled></select>
              <label for="model-drone">无人机模型</label>
              <select id="model-drone" disabled></select>
              <div class="toolbar">
                <button type="button" id="models-apply" class="primary" disabled>应用载具模型</button>
              </div>
            </div>
            <p class="feedback" id="models-feedback" role="status"></p>
          </div>

          <div class="tab-panel" id="panel-profile" role="tabpanel"
            aria-labelledby="tab-profile" hidden>
            <div class="stack">
              <label for="profile-choice">当前规划器</label>
              <select id="profile-choice" disabled></select>
              <div class="toolbar">
                <button type="button" id="profile-apply" class="primary" disabled>切换</button>
              </div>
            </div>
            <p class="feedback" id="profile-feedback" role="status"></p>
          </div>
        </div>
      </section>

      <section class="card trajectory-card" id="trajectory-card">
        <div class="card-head">
          <h2>剩余轨迹</h2>
          <div class="head-tools">
            <span class="muted" id="trajectory-status">等待连接</span>
            <button type="button" class="ghost" id="trajectory-toggle"
              aria-expanded="false" hidden>展开 ▾</button>
          </div>
        </div>
        <ol class="trajectory-list" id="trajectory-list" hidden></ol>
        <div class="trajectory-empty" id="trajectory-empty">
          <strong id="trajectory-empty-title">等待任务</strong>
          <small id="trajectory-empty-hint">提交任务后这里会显示剩余航点</small>
        </div>
      </section>
    </aside>
  </main>

  <footer class="foot">
    <a href="/docs" target="_blank" rel="noopener">API 文档 ↗</a>
  </footer>

  <script src="/console/src/core.js"></script>
  <script src="/console/src/world.js"></script>
  <script src="/console/src/settings.js"></script>
  <script src="/console/src/flight.js"></script>
  <script src="/console/src/app.js"></script>
  <script type="module" src="/console/src/scene3d.js"></script>
</body>
</html>
