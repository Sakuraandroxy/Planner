# LLaMA-Factory 微调配置 —— Qwen2.5-VL-7B LoRA for 3DG-VLN waypoint prediction
# 用法: llamafactory-cli train qwen2_5vl_7b_3dgvln_lora.yaml

### model
model_name_or_path: /data/sakura/models/3DG-VLN

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
deepspeed: /data/sakura/data/UAV-VLN-FOV/tools/ds_zero3_offload.json

### dataset
dataset: 3dgvln_waypoints
# dataset_dir: /data/sakura/data/UAV-VLN-FOV/finetune_data  
dataset_dir: /data/sakura/data/UAV-VLN-FOV/finetune_sliding_window
template: qwen2_vl
cutoff_len: 4096
max_samples: 50000
overwrite_cache: True
preprocessing_num_workers: 4
# 1024x1024  524288(724*724) 262144(512*512)
image_max_pixels: 1048576   # 1024x1024, 保留高分辨率
gradient_checkpointing: true

### output
# output_dir: /data/sakura/data/UAV-VLN-FOV/tools/output/qwen2_5vl_7b_3dgvln_lora
output_dir: /data/sakura/data/UAV-VLN-FOV/tools/output/qwen2_5vl_7b_3dgvln_lora_sliding_window
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000


### eval (可选: 如果有 validation set)
# val_size: 0.05
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 500