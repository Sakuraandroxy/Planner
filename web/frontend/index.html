<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni-LaViRA Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo">Uni<span>-LaViRA</span></div>
    <div class="model-badge" id="sModel"></div>
    <div class="sep"></div>
    <div class="task-wrap">
      <label>Task</label>
      <input type="text" id="taskInput" placeholder="Enter task..." spellcheck="false"/>
      <button id="taskBtn" onclick="updateTask()">Update</button>
    </div>
    <div class="sep"></div>
    <div class="badges">
      <span class="stat">Step: <strong id="sStep">0/0</strong></span>
      <span class="stat">Status: <span class="badge badge-starting" id="sStatus">starting</span></span>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Left: Front Camera -->
    <div class="viewport">
      <div class="cam-wrap">
        <span class="cam-placeholder" id="camPlaceholder">Waiting for drone...</span>
        <img id="camImage" style="display:none" alt="Front camera"/>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <!-- Depth -->
      <div class="card depth-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          Depth
        </div>
        <div class="card-body">
          <img id="depthImage" style="width:100%;display:none;border-radius:4px" alt="Depth map"/>
          <div id="depthPlaceholder" class="ph-muted">depth waiting...</div>
        </div>
      </div>

      <!-- Down Camera -->
      <div class="card down-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Down
        </div>
        <div class="card-body">
          <img id="downCamImage" style="width:100%;display:none;border-radius:4px" alt="Down camera"/>
          <span class="cam-placeholder" id="downCamPlaceholder">waiting...</span>
        </div>
      </div>

      <!-- Trajectory -->
      <div class="card trajectory-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 9 12 13 15 20 6"/><circle cx="4" cy="17" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="13" cy="15" r="2"/><circle cx="20" cy="6" r="2"/></svg>
          Trajectory
        </div>
        <div class="card-body">
          <div class="trajectory-debug" id="sTrajectory"><span class="ph-muted">waiting for waypoints...</span></div>
        </div>
      </div>

      <!-- Memory -->
      <div class="card memory-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M5 8h14"/><path d="M5 16h14"/><circle cx="12" cy="8" r="3"/><circle cx="12" cy="16" r="3"/></svg>
          Memory
        </div>
        <div class="card-body">
          <div class="memory-debug" id="sMemory"><span class="ph-muted">waiting for memory...</span></div>
        </div>
      </div>

      <!-- Status -->
      <div class="card status-card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Status
        </div>
        <div class="card-body">
          <div class="reasoning-box" id="sReasoning"><span class="reasoning-placeholder">Waiting...</span></div>
        </div>
      </div>
    </div>
  </div>

<script src="/app.js"></script>
</body>
</html>
